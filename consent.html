<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-3x34yu16FGEAgltM2Em6/E4pwAEt/zcq7Nz9LFic854=' https://esm.sh https://*.esm.sh; style-src 'unsafe-inline'; connect-src https://wgfpbkwjrejnlliznfdu.supabase.co; base-uri 'none'; form-action 'self'">
  <title>EasyCRM access</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 38rem; margin: 8vh auto; padding: 0 1.25rem; color: #18212f; }
    main { border: 1px solid #d8dfe7; border-radius: 12px; padding: 1.5rem; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label, input, button { display: block; }
    input { box-sizing: border-box; width: 100%; padding: .65rem; margin: .3rem 0 1rem; font: inherit; }
    button { border: 0; border-radius: 6px; padding: .65rem 1rem; margin: .5rem .5rem .5rem 0; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .primary { background: #155e54; color: white; }
    .secondary { background: #e9edf2; color: #18212f; }
    .muted { color: #526172; }
    #message { white-space: pre-wrap; }
    [hidden] { display: none !important; }
    dd { margin: 0 0 .8rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>EasyCRM access</h1>
    <p id="message" role="status">Checking sign-in…</p>
    <section id="sign-in" hidden>
      <p>Sign in with your CRM email. We’ll send a one-time code to your inbox.</p>
      <form id="email-form">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>
        <button class="primary" type="submit">Send sign-in code</button>
      </form>
      <form id="code-form" hidden>
        <label for="code">Code from your email</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </section>
    <section id="consent" hidden>
      <p><strong id="client-name"></strong> wants to access your EasyCRM account.</p>
      <dl>
        <dt>Signed in as</dt><dd id="user-email"></dd>
        <dt>Return to</dt><dd id="redirect-uri"></dd>
        <dt>Requested permissions</dt><dd id="scopes"></dd>
      </dl>
      <p class="muted">Approval lets this app read and change CRM data you can access. Only approve apps you trust.</p>
      <button class="primary" id="approve" type="button">Approve</button>
      <button class="secondary" id="deny" type="button">Deny</button>
    </section>
  </main>
  <script type="module" >
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.118.0";

    const supabase = createClient("https://wgfpbkwjrejnlliznfdu.supabase.co", "sb_publishable_fzbWR-ofh2QQPdv8-o_W_w__rrMIP3d", {
      auth: { persistSession: true, detectSessionInUrl: true, flowType: "pkce" },
    });
    const authorizationId = new URL(location.href).searchParams.get("authorization_id");
    const message = document.getElementById("message");
    const signIn = document.getElementById("sign-in");
    const consent = document.getElementById("consent");
    const emailInput = document.getElementById("email");
    const codeForm = document.getElementById("code-form");
    const show = (text) => { message.textContent = text; };
    const urlError = new URL(location.href).searchParams.get("error_description")
      || new URLSearchParams(location.hash.slice(1)).get("error_description");

    async function start() {
      if (!authorizationId) {
        show("Missing authorization request. Open this page from your MCP client.");
        return;
      }
      const { data: { user }, error: userError } = await supabase.auth.getUser();
      if (!user) {
        show(urlError || (userError && userError.name !== "AuthSessionMissingError" ? userError.message : ""));
        signIn.hidden = false;
        return;
      }
      const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
      if (error || !data) {
        show(error?.message || "Invalid or expired authorization request.");
        return;
      }
      if (!("authorization_id" in data)) {
        location.assign(data.redirect_url);
        return;
      }
      document.getElementById("client-name").textContent = data.client.name;
      document.getElementById("user-email").textContent = user.email || user.id;
      document.getElementById("redirect-uri").textContent = data.redirect_uri;
      document.getElementById("scopes").textContent = data.scope?.trim() || "CRM access";
      show("");
      consent.hidden = false;
    }

    document.getElementById("email-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector("button");
      button.disabled = true;
      show("Sending sign-in code…");
      const email = emailInput.value.trim();
      const redirect = new URL(location.href);
      redirect.hash = "";
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: redirect.toString(), shouldCreateUser: false },
      });
      show(error ? error.message : "Check your inbox and enter the code below.");
      if (!error) {
        codeForm.hidden = false;
        document.getElementById("code").focus();
      }
      button.disabled = false;
    });

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector("button");
      button.disabled = true;
      show("Verifying code…");
      const { error } = await supabase.auth.verifyOtp({
        email: emailInput.value.trim(),
        token: document.getElementById("code").value.trim(),
        type: "email",
      });
      if (error) {
        show(error.message);
        button.disabled = false;
        return;
      }
      signIn.hidden = true;
      await start();
    });

    for (const decision of ["approve", "deny"]) {
      document.getElementById(decision).addEventListener("click", async () => {
        document.getElementById("approve").disabled = true;
        document.getElementById("deny").disabled = true;
        show("Processing your choice…");
        const result = decision === "approve"
          ? await supabase.auth.oauth.approveAuthorization(authorizationId)
          : await supabase.auth.oauth.denyAuthorization(authorizationId);
        if (result.error || !result.data?.redirect_url) {
          show(result.error?.message || "Could not complete authorization.");
          document.getElementById("approve").disabled = false;
          document.getElementById("deny").disabled = false;
          return;
        }
        location.assign(result.data.redirect_url);
      });
    }

    start().catch((error) => show(error instanceof Error ? error.message : "Sign-in failed."));
  </script>
</body>
</html>
